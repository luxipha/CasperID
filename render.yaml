services:
  # Backend Staging
  - type: web
    name: casperid-server-staging
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: staging
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: casperid-frontend-staging
          property: url
      - key: API_BASE_URL
        fromService:
          type: web
          name: casperid-server-staging
          property: url

  # Frontend Staging
  - type: web
    name: casperid-frontend-staging
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: casperid-server-staging
          property: url
      - key: VITE_NODE_ENV
        value: staging
