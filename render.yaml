services:
  - type: web
    name: casperid-frontend-staging
    runtime: static
    rootDir: frontend
    autoDeployTrigger: checksPass
    buildCommand: npm install --global npm@11.6.1 && npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://casperid-server-staging.onrender.com
      - key: VITE_NODE_ENV
        value: staging
