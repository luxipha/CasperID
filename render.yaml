services:
  # Backend Staging
  - type: web
    name: casperid-server-staging
    plan: free
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: staging
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: casperid-frontend-staging
          property: host
      - key: API_HOST
        fromService:
          type: web
          name: casperid-server-staging
          property: host

  # Frontend Staging
  - type: web
    name: casperid-frontend-staging
    runtime: static
    rootDir: frontend
    # Hardcode the staging URL in the build command to ensure resolution
    buildCommand: npm install && VITE_API_URL="https://casperid-server-staging.onrender.com" npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: casperid-server-staging
          property: host
      - key: VITE_NODE_ENV
        value: staging
