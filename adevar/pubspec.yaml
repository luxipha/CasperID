name: adevar
description: CasperID mobile app - digital identity, ID card, private claims, and data warehouse.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.4.0
  shared_preferences: ^2.5.0
  google_fonts: ^6.2.1
  mobile_scanner: ^6.0.0
  qr_flutter: ^4.1.0
  permission_handler: ^12.0.0+1
  image_picker: ^1.1.2
  camera: ^0.11.1
  provider: ^6.1.4
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
