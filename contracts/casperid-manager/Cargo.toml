[package]
name = "casperid_manager"
version = "0.1.0"
edition = "2021"

[dependencies]
odra = { version = "2.4.0", features = [], default-features = false }

[dev-dependencies]
odra-test = { version = "2.4.0", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.4.0", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.4.0", features = [], default-features = false }
odra-cli = { version = "2.4.0", features = [], default-features = false }
odra-casper-livenet-env = { version = "2.4.0", features = [], default-features = false }

[[bin]]
name = "casperid_manager_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "casperid_manager_build_schema"
path = "bin/build_schema.rs"
test = false


[[bin]]
name = "deploy_livenet"
path = "bin/deploy_livenet.rs"
test = false

[[bin]]
name = "deploy_registry"
path = "bin/deploy_registry.rs"
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
