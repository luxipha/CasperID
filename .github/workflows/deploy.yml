name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'

env:
  PROJECT_ID: ile-africa
  GAR_LOCATION: us-central1
  SERVICE: casper-id-server
  REGION: us-central1

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker push
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          docker build --no-cache -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{  github.sha }} ./server
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{  github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{  github.sha }}
          env_vars: |
            NODE_ENV=production
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            MONGODB_DATABASE_NAME=${{ secrets.MONGODB_DATABASE_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TOKEN_EXPIRATION=${{ secrets.TOKEN_EXPIRATION }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            CASPER_NETWORK=${{ secrets.CASPER_NETWORK }}
            CASPER_NODE_URL=${{ secrets.CASPER_NODE_URL }}
            CONTRACT_HASH=${{ secrets.CONTRACT_HASH }}
            CID_NAME_NFT_CONTRACT_HASH=${{ secrets.CID_NAME_NFT_CONTRACT_HASH }}
            ISSUER_PRIVATE_KEY=${{ secrets.ISSUER_PRIVATE_KEY }}
            ISSUER_PUBLIC_KEY=${{ secrets.ISSUER_PUBLIC_KEY }}
            ISSUER_ID=${{ secrets.ISSUER_ID }}
            UNSPLASH_ACCESS_KEY=${{ secrets.UNSPLASH_ACCESS_KEY }}
            WEBAUTHN_RP_ID=${{ secrets.WEBAUTHN_RP_ID }}
            WEBAUTHN_RP_NAME=${{ secrets.WEBAUTHN_RP_NAME }}
            WEBAUTHN_ORIGIN=${{ secrets.WEBAUTHN_ORIGIN }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}
            SUPPORT_EMAIL_PASSWORD=${{ secrets.SUPPORT_EMAIL_PASSWORD }}
            SUPPORT_EMAIL_HOST=${{ secrets.SUPPORT_EMAIL_HOST }}
            SUPPORT_EMAIL_PORT=${{ secrets.SUPPORT_EMAIL_PORT }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            CSRF_SECRET=${{ secrets.CSRF_SECRET }}
            FIELD_ENCRYPTION_KEY=${{ secrets.FIELD_ENCRYPTION_KEY }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
            STARKNET_RPC_URL=${{ secrets.STARKNET_RPC_URL }}
            STARKNET_RELAY_PRIVATE_KEY=${{ secrets.STARKNET_RELAY_PRIVATE_KEY }}
            STARKNET_RELAY_ADDRESS=${{ secrets.STARKNET_RELAY_ADDRESS }}
            CASPERID_ZK_CONTRACT=${{ secrets.CASPERID_ZK_CONTRACT }}
            IMAGEKIT_PUBLIC_KEY=${{ secrets.IMAGEKIT_PUBLIC_KEY }}
            IMAGEKIT_PRIVATE_KEY=${{ secrets.IMAGEKIT_PRIVATE_KEY }}
            IMAGEKIT_URL_ENDPOINT=${{ secrets.IMAGEKIT_URL_ENDPOINT }}
            EMAIL_PROVIDER=${{ secrets.EMAIL_PROVIDER }}
            LOOPS_API_KEY=${{ secrets.LOOPS_API_KEY }}
            LOOPS_WELCOME_ID=${{ secrets.LOOPS_WELCOME_ID }}
            LOOPS_VERIFICATION_SUCCESS_ID=${{ secrets.LOOPS_VERIFICATION_SUCCESS_ID }}
            LOOPS_PROFILE_VIEWED_ID=${{ secrets.LOOPS_PROFILE_VIEWED_ID }}
            LOOPS_PROFILE_COMPLETED_ID=${{ secrets.LOOPS_PROFILE_COMPLETED_ID }}
            LOOPS_PAYMENT_CONFIRMATION_ID=${{ secrets.LOOPS_PAYMENT_CONFIRMATION_ID }}
            LOOPS_SECURITY_ALERT_ID=${{ secrets.LOOPS_SECURITY_ALERT_ID }}

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}